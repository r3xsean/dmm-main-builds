name: Build latest main

# Builds the newest upstream `main` commit whose core CI passed, as a personal
# Deadlock Mod Manager installer with its own update feed, tests installing it
# over the official nightly, then publishes it. See README.md.

on:
  schedule:
    # Off the quarter hours, which GitHub delays or drops under load.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      sha:
        description: "Upstream commit to build (default: newest eligible)"
        required: false
        default: ""
      force:
        description: "Build even if nothing changed"
        type: boolean
        default: false

permissions:
  contents: read

# One run at a time; a newer trigger replaces the waiting one.
concurrency:
  group: build-main
  cancel-in-progress: false

env:
  UPSTREAM: deadlock-mod-manager/deadlock-mod-manager
  REQUIRED_CHECKS: "Type Check|Run Tests|Run Rust Tests"
  NOTES_BASE: https://github.com/${{ github.repository }}/releases/tag

jobs:
  pick:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.plan.outputs.build }}
      sha: ${{ steps.plan.outputs.sha }}
      short: ${{ steps.plan.outputs.short }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      label: ${{ steps.plan.outputs.label }}
      detail: ${{ steps.plan.outputs.detail }}
      anchor_tag: ${{ steps.plan.outputs.anchor_tag }}
      anchor_version: ${{ steps.plan.outputs.anchor_version }}
      anchor_sha: ${{ steps.plan.outputs.anchor_sha }}
      n: ${{ steps.plan.outputs.n }}
      prev_sha: ${{ steps.plan.outputs.prev_sha }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --no-save --prefix personal semver@7
      - name: Plan the build
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_SHA: ${{ inputs.sha }}
          FORCE: ${{ inputs.force }}
        run: node personal/plan.mjs

  build:
    needs: pick
    if: needs.pick.outputs.build == 'true'
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      SCCACHE_IDLE_TIMEOUT: "0"
      VITE_API_URL: https://api.deadlockmods.app
      VITE_WEB_URL: https://deadlockmods.app
      VITE_AUTH_URL: https://auth.deadlockmods.app
      VITE_DMM_PERSONAL_VERSION: ${{ needs.pick.outputs.version }}
      VITE_DMM_PERSONAL_LABEL: ${{ needs.pick.outputs.label }}
      VITE_DMM_PERSONAL_NOTES_URL: ${{ format('https://github.com/{0}/releases/tag/{1}', github.repository, needs.pick.outputs.tag) }}
      VERSION: ${{ needs.pick.outputs.version }}
      TAG: ${{ needs.pick.outputs.tag }}
    steps:
      # Patches are LF; keep the upstream checkout LF too so they apply exactly.
      - run: git config --global core.autocrlf false

      - name: Check out upstream at the picked commit
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ env.UPSTREAM }}
          ref: ${{ needs.pick.outputs.sha }}

      - name: Check out this repo's patches
        uses: actions/checkout@v7.0.1
        with:
          path: .personal-repo

      - name: Apply the personal patches (fails on any mismatch)
        shell: bash
        run: |
          set -euo pipefail
          for p in .personal-repo/personal/patches/*.patch; do
            git apply --check "$p"
            git apply "$p"
            echo "applied $p"
          done
          # The behaviour the patches exist for must be present.
          grep -q 'r3xsean/dmm-main-builds/releases/latest/download/latest.json' apps/desktop/src-tauri/src/updater_channel.rs
          grep -q 'release.version > current' apps/desktop/src-tauri/src/app_updates.rs
          ! grep -q 'release.version != current' apps/desktop/src-tauri/src/app_updates.rs
          grep -q 'VITE_DMM_PERSONAL_LABEL' apps/desktop/src/lib/app-version-display.ts
          grep -q 'VITE_DMM_PERSONAL_VERSION' apps/desktop/src/hooks/use-whats-new.ts

      - name: Stamp version, labels and config
        shell: bash
        env:
          DETAIL: ${{ needs.pick.outputs.detail }}
          PERSONAL_DIR: .personal-repo/personal
          OVERLAY: ${{ runner.temp }}/personal.tauri.conf.json
        run: node .personal-repo/personal/stamp.mjs

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Configure sccache for cargo
        shell: bash
        run: |
          SCCACHE_WRAPPER="${SCCACHE_PATH//\\//}"
          echo "RUSTC_WRAPPER=${SCCACHE_WRAPPER}" >> "$GITHUB_ENV"
          mkdir -p "$CARGO_HOME"
          printf '[build]\nrustc-wrapper = "%s"\n' "$SCCACHE_WRAPPER" >> "$CARGO_HOME/config.toml"

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop -> target
          key: main-windows
          cache-on-failure: true

      - uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the installer
        working-directory: apps/desktop
        run: pnpm tauri build --bundles nsis --config "${{ runner.temp }}/personal.tauri.conf.json"

      - name: Stage the files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $setup = Get-ChildItem apps/desktop/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (-not $setup) { throw 'No NSIS installer was produced.' }
          Copy-Item -LiteralPath $setup.FullName -Destination "dist/DMM-$env:TAG-setup.exe"
          Copy-Item -LiteralPath apps/desktop/target/release/deadlock-mod-manager.exe -Destination "dist/DMM-$env:TAG-portable.exe"
          Copy-Item -LiteralPath LICENSE.md -Destination dist/LICENSE.md
          Copy-Item -Path .personal-repo/personal/patches/*.patch -Destination dist/

      # The only step that sees the signing key; it runs nothing from upstream but the Tauri CLI.
      - name: Sign the installer for the updater
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri signer sign "../../dist/DMM-$env:TAG-setup.exe"

      - name: Write the update manifest
        shell: pwsh
        env:
          SHA: ${{ needs.pick.outputs.sha }}
          ANCHOR_TAG: ${{ needs.pick.outputs.anchor_tag }}
          ANCHOR_VERSION: ${{ needs.pick.outputs.anchor_version }}
          ANCHOR_SHA: ${{ needs.pick.outputs.anchor_sha }}
          N: ${{ needs.pick.outputs.n }}
          LABEL: ${{ needs.pick.outputs.label }}
          DETAIL: ${{ needs.pick.outputs.detail }}
        run: |
          $setupName = "DMM-$env:TAG-setup.exe"
          $sig = (Get-Content -Raw "dist/$setupName.sig").Trim()
          $url = "https://github.com/${{ github.repository }}/releases/download/$env:TAG/$setupName"
          $platform = @{ signature = $sig; url = $url }
          [ordered]@{
            version = $env:VERSION
            notes = "v$env:LABEL · $env:DETAIL"
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{ 'windows-x86_64-nsis' = $platform; 'windows-x86_64' = $platform }
          } | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8NoBOM dist/latest.json
          [ordered]@{
            format = 2
            tag = $env:TAG
            version = $env:VERSION
            label = $env:LABEL
            detail = $env:DETAIL
            sha = $env:SHA
            n = [int]$env:N
            anchor = [ordered]@{ tag = $env:ANCHOR_TAG; version = $env:ANCHOR_VERSION; sha = $env:ANCHOR_SHA }
            patchRev = "${{ github.sha }}"
            built = (Get-Date).ToUniversalTime().ToString("o")
            setup = $setupName
            setupSha256 = (Get-FileHash -Algorithm SHA256 "dist/$setupName").Hash.ToLower()
            run = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8NoBOM dist/manifest.json
          Get-Content dist/manifest.json

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release
          path: dist/
          if-no-files-found: error

  test:
    needs: [pick, build]
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: dist
      - name: Install over the official nightly
        shell: pwsh
        run: ./personal/migration-test.ps1 -Setup "dist/DMM-${{ needs.pick.outputs.tag }}-setup.exe" -Version "${{ needs.pick.outputs.version }}" -Upstream "${{ env.UPSTREAM }}"

  publish:
    needs: [pick, build, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.pick.outputs.tag }}
      VERSION: ${{ needs.pick.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: dist
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --no-save --prefix personal semver@7
      - name: Re-check that this is still the newest build
        env:
          NODE_PATH: personal/node_modules
        run: |
          set -euo pipefail
          # `pick` already checked this; check again in case another run published meanwhile.
          if gh release download --repo "$GITHUB_REPOSITORY" --pattern manifest.json --dir prev 2>/dev/null; then
            prev_version=$(jq -r .version prev/manifest.json)
            node -e 'const s=require("semver"); const [v,p]=process.argv.slice(1); if(!s.gt(v,p)){console.error(`::error::${v} is not newer than ${p}`);process.exit(1)} console.log(`${v} > ${p}`)' "$VERSION" "$prev_version"
          fi
      - name: Publish
        env:
          LABEL: ${{ needs.pick.outputs.label }}
          DETAIL: ${{ needs.pick.outputs.detail }}
          SHA: ${{ needs.pick.outputs.sha }}
          PREV: ${{ needs.pick.outputs.prev_sha }}
          ANCHOR_VERSION: ${{ needs.pick.outputs.anchor_version }}
        run: |
          set -euo pipefail
          subject=$(gh api "repos/$UPSTREAM/commits/$SHA" --jq '.commit.message | split("\n")[0]')
          {
            echo "**v$LABEL** · $DETAIL"
            echo
            echo "Unofficial personal build of [Deadlock Mod Manager](https://github.com/$UPSTREAM) \`main\`. Not affiliated with or supported by the DMM team."
            echo
            echo "- Version: \`$VERSION\`"
            echo "- Upstream commit: [\`${SHA:0:8}\`](https://github.com/$UPSTREAM/commit/$SHA) — $subject"
            echo "- Counted from official \`$ANCHOR_VERSION\`"
            echo "- Changes from upstream: the attached \`.patch\` files (personal update feed and key, newer-only updates, sidebar label, no automatic What's New, backups in the installer). Source: upstream at that commit plus those patches. GPL-3.0."
            if [ -n "$PREV" ] && [ "$PREV" != "$SHA" ]; then
              echo
              echo "## Upstream changes since the last build"
              echo
              gh api "repos/$UPSTREAM/compare/$PREV...$SHA" --jq '.commits[] | "- " + (.commit.message | split("\n")[0]) + " (" + .sha[0:8] + ")"' | tail -n 60
            fi
          } > notes.md
          # Upload everything as a draft first; only then make it the release the app sees.
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "v$LABEL ($TAG)" --notes-file notes.md --draft
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
      - name: Keep the newest 15 builds
        run: |
          # Order by run number: every release's createdAt is the same (the date of
          # the commit its tag points at), so sorting by it deleted new builds.
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName \
            --jq 'map(.tagName | select(test("^main-[0-9]+$"))) | sort_by(ltrimstr("main-") | tonumber) | reverse | .[15:] | .[]' \
            | while read -r tag; do
                [ "$tag" = "$TAG" ] && continue
                gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
              done
