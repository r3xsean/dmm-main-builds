name: Build latest main

# Builds the newest upstream `main` commit whose core CI passed, as a standalone
# Windows exe, and publishes it as a release. Mirrors upstream's nightly build
# settings (thin LTO, 16 codegen units) without signing or bundling.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      sha:
        description: "Upstream commit to build (default: newest eligible)"
        required: false
        default: ""
      force:
        description: "Build even if already built or no app changes"
        type: boolean
        default: false

permissions:
  contents: write

# One build runs; at most one more waits. A newer trigger replaces the waiting one.
concurrency:
  group: build-main
  cancel-in-progress: false

env:
  UPSTREAM: deadlock-mod-manager/deadlock-mod-manager
  # Upstream CI jobs that must pass on the exact commit.
  REQUIRED_CHECKS: "Type Check|Run Tests|Run Rust Tests"

jobs:
  pick:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.pick.outputs.build }}
      sha: ${{ steps.pick.outputs.sha }}
      short: ${{ steps.pick.outputs.short }}
      prev: ${{ steps.pick.outputs.prev }}
    steps:
      - name: Pick the newest eligible upstream commit
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_SHA: ${{ inputs.sha }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          eligible() {
            local runs
            runs=$(gh api "repos/$UPSTREAM/commits/$1/check-runs?per_page=100" --paginate \
              --jq '.check_runs[] | [.name, .status, (.conclusion // ""), (.started_at // "")] | @tsv')
            # Every required check: its most recent run completed with success.
            IFS='|' read -ra required <<< "$REQUIRED_CHECKS"
            for name in "${required[@]}"; do
              local last
              last=$(printf '%s\n' "$runs" | awk -F'\t' -v n="$name" '$1==n' | sort -t$'\t' -k4 | tail -n1)
              [ -n "$last" ] || return 1
              [ "$(cut -f2 <<< "$last")" = completed ] && [ "$(cut -f3 <<< "$last")" = success ] || return 1
            done
            # Desktop E2E scenarios don't run on every commit, but if any ran and failed, skip.
            if printf '%s\n' "$runs" | awk -F'\t' '$1 ~ /scenarios/ && $2=="completed" && $3!="success" && $3!="skipped" && $3!="neutral"' | grep -q .; then
              return 1
            fi
          }

          if [ -n "$INPUT_SHA" ]; then
            sha=$(gh api "repos/$UPSTREAM/commits/$INPUT_SHA" --jq .sha)
          else
            sha=""
            for candidate in $(gh api "repos/$UPSTREAM/commits?sha=main&per_page=30" --jq '.[].sha'); do
              if eligible "$candidate"; then sha=$candidate; break; fi
            done
          fi
          if [ -z "$sha" ]; then
            echo "No eligible commit among the latest 30 on main."
            echo "build=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          short=${sha:0:8}
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short=$short" >> "$GITHUB_OUTPUT"

          # The previous build's full SHA is stored in its release body.
          prev=$(gh release view --repo "$GITHUB_REPOSITORY" --json body --jq .body 2>/dev/null \
            | sed -n 's/^Upstream commit: `\([0-9a-f]\{40\}\)`.*/\1/p' | head -n1 || true)
          echo "prev=$prev" >> "$GITHUB_OUTPUT"

          if [ "$FORCE" != "true" ]; then
            if gh release view "main-$short" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "main-$short is already built."
              echo "build=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
            if [ -n "$prev" ]; then
              changed=$(gh api "repos/$UPSTREAM/compare/$prev...$sha" --jq '.files[].filename' \
                | grep -E '^(apps/desktop/|packages/|pnpm-lock\.yaml|package\.json|Cargo\.lock)' || true)
              if [ -z "$changed" ]; then
                echo "No app changes between ${prev:0:8} and $short."
                echo "build=false" >> "$GITHUB_OUTPUT"; exit 0
              fi
            fi
          fi
          echo "Building $short"
          echo "build=true" >> "$GITHUB_OUTPUT"

  build:
    needs: pick
    if: needs.pick.outputs.build == 'true'
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      SCCACHE_IDLE_TIMEOUT: "0"
      VITE_API_URL: https://api.deadlockmods.app
      VITE_WEB_URL: https://deadlockmods.app
      VITE_AUTH_URL: https://auth.deadlockmods.app
      SHA: ${{ needs.pick.outputs.sha }}
      SHORT: ${{ needs.pick.outputs.short }}
      PREV: ${{ needs.pick.outputs.prev }}
    steps:
      - name: Check out upstream at the picked commit
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ env.UPSTREAM }}
          ref: ${{ needs.pick.outputs.sha }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Configure sccache for cargo
        shell: bash
        run: |
          SCCACHE_WRAPPER="${SCCACHE_PATH//\\//}"
          echo "RUSTC_WRAPPER=${SCCACHE_WRAPPER}" >> "$GITHUB_ENV"
          mkdir -p "$CARGO_HOME"
          printf '[build]\nrustc-wrapper = "%s"\n' "$SCCACHE_WRAPPER" >> "$CARGO_HOME/config.toml"

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop -> target
          key: main-windows
          cache-on-failure: true

      - uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # Required by prost-build (steam-vent/valveprotos).
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Stamp the version with the commit
        shell: bash
        run: pnpm version:nightly "$(git rev-parse --short HEAD)"

      - name: Build the app
        working-directory: apps/desktop
        run: pnpm tauri build --no-bundle

      - name: Stage the release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $version = (Get-Content -LiteralPath apps/desktop/package.json -Raw | ConvertFrom-Json).version
          $exe = "dist/dmm-main-$env:SHORT.exe"
          Copy-Item -LiteralPath apps/desktop/target/release/deadlock-mod-manager.exe -Destination $exe
          Copy-Item -LiteralPath LICENSE.md -Destination dist/LICENSE.md
          $date = git show -s --format=%cI HEAD
          [ordered]@{
            tag = "main-$env:SHORT"
            sha = $env:SHA
            version = $version
            committed = $date
            built = (Get-Date).ToUniversalTime().ToString("o")
            exe = "dmm-main-$env:SHORT.exe"
            sha256 = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLower()
            run = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } | ConvertTo-Json | Set-Content -Encoding utf8 dist/manifest.json
          Get-Content dist/manifest.json

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          subject=$(git show -s --format=%s HEAD)
          {
            echo "Unofficial build of [Deadlock Mod Manager](https://github.com/$UPSTREAM) \`main\`. Not affiliated with or supported by the DMM team."
            echo
            echo "Upstream commit: \`$SHA\` ([source](https://github.com/$UPSTREAM/tree/$SHA))"
            echo "Latest change: $subject"
            echo
            echo "Built with upstream's nightly settings (release, thin LTO, 16 codegen units), unsigned, no installer. Licensed GPL-3.0; source at the commit above."
            if [ -n "$PREV" ]; then
              echo
              echo "## Changes since ${PREV:0:8}"
              echo
              gh api "repos/$UPSTREAM/compare/$PREV...$SHA" --jq '.commits[] | "- " + (.commit.message | split("\n")[0]) + " (" + .sha[0:8] + ")"' | tail -n 50
            fi
          } > notes.md
          gh release create "main-$SHORT" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "main $SHORT" \
            --notes-file notes.md \
            --latest

      - name: Keep the newest 15 builds
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,createdAt \
            --jq 'map(select(.tagName | startswith("main-"))) | sort_by(.createdAt) | reverse | .[15:] | .[].tagName' \
            | while read -r tag; do
                gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
              done
